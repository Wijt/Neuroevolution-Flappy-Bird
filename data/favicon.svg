<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Arka Plan Gradiyenti -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Kuş Gövde Gradiyenti -->
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    
    <!-- Gaga Gradiyenti -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    
    <!-- Parlama Efekti -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Flappy Bird Gövde -->
  <circle cx="30" cy="34" r="15" fill="url(#birdGrad)"/>
  
  <!-- Gaga -->
  <path d="M 42 30 L 54 34 L 42 39 Z" fill="url(#beakGrad)"/>
  
  <!-- Göz -->
  <circle cx="38" cy="27" r="5" fill="#ffffff"/>
  <circle cx="39.5" cy="27" r="2.5" fill="#0f172a"/>
  <circle cx="40" cy="26.2" r="0.8" fill="#38bdf8"/>

  <!-- Kanat -->
  <path d="M 18 36 Q 26 36 28 44 Q 20 46 18 36 Z" fill="#d97706"/>

  <!-- Sinir Ağı / Yapay Zeka Çizgileri -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.9" filter="url(#glow)">
    <line x1="16" y1="26" x2="26" y2="18" />
    <line x1="16" y1="26" x2="26" y2="32" />
    <line x1="26" y1="18" x2="38" y2="20" />
    <line x1="26" y1="32" x2="38" y2="20" />
    <line x1="26" y1="18" x2="26" y2="32" />
  </g>

  <!-- Nöron Düğümleri (AI Brain Nodes) -->
  <g filter="url(#glow)">
    <circle cx="16" cy="26" r="2.5" fill="#38bdf8"/>
    <circle cx="26" cy="18" r="2.5" fill="#38bdf8"/>
    <circle cx="26" cy="32" r="2.5" fill="#38bdf8"/>
    <circle cx="38" cy="20" r="3" fill="#818cf8"/>
  </g>
</svg>
